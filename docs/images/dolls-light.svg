<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="t d">
  <title id="t">frame-loop's frames, nested</title>
  <desc id="d">You hold the method, frame-loop on Gadfly, which holds the workflow, Claude Code, which holds the reader. An outer frame declares what the inner may do and is never rewritten from inside; an inner frame informs an outer one only through a gate; a mismatch becomes a change you declare.</desc>
  <style>
    svg { --ink: #1f2328; --line: #1f2328; --f1: #ffffff; --f2: #efefef; --f3: #dedede; --f4: #c6c6c6; }
    text { font-family: "Latin Modern Roman", "CMU Serif", "Computer Modern", "Times New Roman", Georgia, serif; font-size: 19px; fill: var(--ink); }
    .b { font-weight: 700; }
    .box { stroke: var(--line); stroke-width: 1.3; }
    .arrow { stroke: var(--line); stroke-width: 1.4; fill: none; }
    .head { fill: var(--line); }
  </style>
  <rect x="128" y="73" width="677" height="555" rx="16" class="box" style="fill: var(--f1)"/>
  <text x="149" y="108"><tspan class="b">You</tspan>: what the work is for, frame 0 in your words;</text>
  <text x="149" y="134">your rules, written before any change</text>

  <rect x="156" y="153" width="620" height="393" rx="14" class="box" style="fill: var(--f2)"/>
  <text x="178" y="189"><tspan class="b">Method</tspan> (frame-loop, on Gadfly): free checks every turn,</text>
  <text x="178" y="215">the requirement removed or reversed; fixed rules</text>
  <text x="660" y="252" text-anchor="end">labels each change ↓</text>
  <text x="660" y="277" text-anchor="end">an act that is yours ↑</text>
  <line x1="682" y1="218" x2="682" y2="300" class="arrow"/>
  <path d="M676 226 L682 214 L688 226 Z" class="head"/>
  <path d="M676 292 L682 304 L688 292 Z" class="head"/>

  <rect x="185" y="305" width="562" height="208" rx="14" class="box" style="fill: var(--f3)"/>
  <text x="206" y="341"><tspan class="b">Workflow</tspan> (Claude Code): a session, its turns and</text>
  <text x="206" y="367">tools; Claude, the project, crossings</text>

  <rect x="213" y="382" width="505" height="100" rx="14" class="box" style="fill: var(--f4)"/>
  <text x="236" y="417"><tspan class="b">Reader</tspan> (an LLM): a separate model, answering</text>
  <text x="236" y="443">one prompt about a label, never told which</text>
  <text x="236" y="469">trial it serves</text>

  <line x1="101" y1="462" x2="101" y2="104" class="arrow"/>
  <path d="M95 112 L101 98 L107 112 Z" class="head"/>
  <text x="93" y="250" text-anchor="end">informs</text>
  <text x="93" y="275" text-anchor="end">only</text>
  <text x="93" y="300" text-anchor="end">through</text>
  <text x="93" y="325" text-anchor="end">a gate</text>

  <line x1="828" y1="98" x2="828" y2="456" class="arrow"/>
  <path d="M822 448 L828 462 L834 448 Z" class="head"/>
  <text x="838" y="250">declares;</text>
  <text x="838" y="275">never</text>
  <text x="838" y="300">rewritten</text>
  <text x="838" y="325">from inside</text>

  <path d="M594 546 C594 572, 586 584, 568 587" class="arrow" stroke-dasharray="6 5"/>
  <path d="M572 581 L558 588 L572 594 Z" class="head"/>
  <text x="545" y="594" text-anchor="end">▲ a mismatch becomes a change You declare</text>
</svg>
