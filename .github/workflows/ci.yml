name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to the commit of its release, not a moving tag.
jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13", "3.14", "3.15"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - name: Git identity for the tests' own repositories
        run: git config --global user.email ci@example.invalid && git config --global user.name ci
      - name: Lint and format
        run: uvx ruff@0.17.4 check . && uvx ruff@0.17.4 format --check .
      - name: Test forward
        run: uv run --no-project --python ${{ matrix.python }} python tests/run.py
      - name: Test reverse
        run: uv run --no-project --python ${{ matrix.python }} python tests/run.py reverse

  coverage:
    name: Coverage on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.13"
      - name: Git identity for the tests' own repositories
        run: git config --global user.email ci@example.invalid && git config --global user.name ci
      - name: Coverage of the hooks, held to its floor in .coveragerc
        run: sh scripts/coverage.sh

  plugin:
    name: Plugin on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
      - name: Install Claude Code, the version the docs are tested with
        run: npm install -g @anthropic-ai/claude-code@2.1.330
      - name: The band's plain tests
        run: node --import ./tests/node/resolve.mjs --test 'tests/node/*.spec.ts'
      - name: Validate, as the plugin directory does
        run: claude plugin validate . --strict --profile directory
      - name: The band's tests
        run: claude plugin test .
